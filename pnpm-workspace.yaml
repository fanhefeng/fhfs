# Reject runtimes below the patched Node.js version in package.json.
engineStrict: true
# Every dependency with an install script has to get a verdict here, or pnpm 11
# fails the install outright (ERR_PNPM_IGNORED_BUILDS) instead of warning. It
# never came up locally because this machine's global pnpm config carries
# `dangerouslyAllowAllBuilds: true`; CI has no such config, so the deploy is
# where it surfaces. `allowBuilds` replaces pnpm 10's onlyBuiltDependencies /
# ignoredBuiltDependencies pair — pnpm 11 ignores those two keys.
allowBuilds:
  # Native binaries these ship as optional deps; their scripts just wire them up.
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  # Unused here — nothing needs their postinstall to run.
  sharp: true
  workerd: true
  better-sqlite3: false
  unrs-resolver: false
# sharp < 0.35.5 bundles a vulnerable librsvg (GHSA-wq5f-xc86-pv6w).
# Keep the override within the compatible 0.35 release line.
overrides:
  sharp: "^0.35.5"
  # Cloudflare packages still pin Undici before the October security fixes.
  undici: "7.30.1"
  # October serializer fixes used by TanStack Start's SSR transport.
  seroval: "1.6.11"
  # Void's glob matcher keeps the same named API on the fixed release.
  "void>minimatch": "11.0.1"
  # Keep Satori's font decompressor within its patched 0.7 line.
  "satori>fflate": "0.7.5"
  # GHSA-mrhx-c7xc-m3w5: retain Cloudflare config's Zod 4 API with the fixed patch.
  "@cloudflare/config>zod": "4.6.7"
  # Keep the local Workers runtime and its development/deployment hosts current.
  workerd: "1.20261022.1"
  miniflare: "5.20261019.1-beta"
  wrangler: "4.151.3"
  # drizzle-kit's legacy TS loader still pins vulnerable esbuild 0.18.
  # Reuse the patched version drizzle-kit itself already uses (GHSA-67mh-4wv8-2f99).
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  # Vite+ ships its own Vite and pins the Vitest it was built against; every
  # copy in the tree resolves to those two (catalog below).
  vite@*: "catalog:"
  vitest@*: "catalog:"
# The toolchain moves as one: vite-plus, and the Vite and Vitest it pins.
# Bump them together, to what the new vite-plus lists as its dependencies.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0
  vite-plus: 1.5.0
  "@vitest/coverage-v8": 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
packageExtensions:
  "wrangler@4.151.3":
    dependencies:
      undici: "7.30.1"
  "@cloudflare/vite-plugin@1.64.0":
    dependencies:
      undici: "7.30.1"
  "cf@1.0.0-beta.18":
    dependencies:
      undici: "7.30.1"
patchedDependencies:
  "@react-three/fiber@9.8.1": patches/@react-three__fiber@9.8.1.patch
