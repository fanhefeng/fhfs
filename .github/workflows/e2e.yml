name: native admin flows
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 21 * * *" # Daily, 05:53 Asia/Shanghai; fhfs has its own test database.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fhfs-e2e-database
  cancel-in-progress: false
jobs:
  flows:
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chrome
      - name: Verify native admin against its guarded test database and local media
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: pnpm e2e
      # Never publish authenticated browser state or report artifacts.
