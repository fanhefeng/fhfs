name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - run: node scripts/check-runtime.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:vercel
  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fhfs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          package-manager-cache: false
      - run: node scripts/check-runtime.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Check that this is still the latest main commit
        id: revision
        shell: bash
        run: |
          remote_main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$remote_main_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping an older commit because main has advanced."
          fi
      - name: Publish with Void to Cloudflare
        if: steps.revision.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fb12b12d229e15430dd17b9af5d6f1fe
          CLOUDFLARE_WORKERS_SUBDOMAIN: fhfs
          WRANGLER_LOG_PATH: .void/wrangler.log
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure the repository Secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          pnpm run deploy:cloudflare
      - name: Verify public pages and native backend authentication
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm smoke https://fhfs.fhfs.workers.dev
      - name: Verify public uptime probes
        if: steps.revision.outputs.deploy == 'true'
        run: pnpm uptime
