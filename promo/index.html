<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>fhf’s · 留一盏自己的灯</title>
    <link rel="stylesheet" href="/rounded.css" />
    <style>
      @font-face {
        font-family: Nunito;
        src: url("/fonts/latin/Nunito.woff2");
        font-weight: 200 1000;
      }
      @font-face {
        font-family: Josefin;
        src: url("/fonts/latin/JosefinSans.woff2");
        font-weight: 100 700;
      }
      @font-face {
        font-family: Geist;
        src: url("/fonts/latin/GeistMono.woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #171719;
        color: #faf9f6;
        font:
          15px Nunito,
          "FHFS Rounded SC",
          sans-serif;
        display: flex;
        min-height: 100svh;
        align-items: center;
        justify-content: center;
        gap: 44px;
        padding: 28px;
      }
      canvas {
        height: min(88svh, 960px);
        max-width: 100%;
        aspect-ratio: 9/16;
        display: block;
        box-shadow: 0 24px 80px #0005;
      }
      .info {
        max-width: 320px;
      }
      h1 {
        font-size: 28px;
        font-weight: 650;
        line-height: 1.5;
      }
      p {
        color: #c7c4bd;
        line-height: 1.9;
      }
      .meta {
        font:
          12px Geist,
          monospace;
        letter-spacing: 0.08em;
        color: #a9cbff;
      }
      button,
      a {
        display: inline-block;
        border: 1px solid #ffffff45;
        color: inherit;
        background: transparent;
        border-radius: 40px;
        padding: 10px 24px;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      button:hover,
      a:hover {
        background: #ffffff12;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid #a9cbff;
        outline-offset: 4px;
      }
      input {
        width: 100%;
        accent-color: #a9cbff;
        margin: 26px 0 10px;
      }
      .time {
        font: 12px Geist;
      }
      .note {
        font-size: 12px;
      }
      audio {
        display: none;
      }
      @media (max-width: 700px) {
        body {
          flex-direction: column;
          padding: 14px;
          gap: 24px;
        }
        canvas {
          height: 75svh;
        }
        .info {
          max-width: 430px;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      width="1080"
      height="1920"
      aria-label="fhf's 个人网站宣传片：霓虹入口、个人介绍、文章与软件、苔藓实验、生活收藏、访问网址"
    ></canvas>
    <div class="info">
      <div class="meta">FHF’S / BRAND FILM · 2026</div>
      <h1>留一盏自己的灯</h1>
      <p>写代码，也认真生活。<br />欢迎来到 fhf 的小世界。</p>
      <button id="play" type="button">播放短片</button>
      <button id="restart" type="button">从头播放</button
      ><label for="seek" class="note"
        ><input
          id="seek"
          type="range"
          min="0"
          max="25"
          step="0.01"
          value="0"
          aria-label="短片播放进度"
      /></label>
      <div class="time" id="time">00:00 / 00:25</div>
      <p class="note">9:16 · 1080 × 1920 · 30 fps<br />本站画面 · 原创合成配乐</p>
      <a href="/output/fhfs-promo-vertical.mp4" download>下载 MP4</a>
      <p class="note">
        霓虹图形改编自 Espandero / Seb’s.svg，CC BY-SA 4.0。完整素材说明见工程 CREDITS.md。
      </p>
    </div>
    <audio id="audio" src="/output/score.wav" preload="auto"></audio>
    <script type="module" src="/film.mjs"></script>
  </body>
</html>
